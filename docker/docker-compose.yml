# Dev environment. Run from the project root:
#   docker compose -f docker/docker-compose.yml up
# App will be at http://localhost:7331
#
# The project root is bind-mounted into the container, so code edits and
# the rv/ package library (installed on first run) persist on the host.
# The DB folder next to the repo (../db: db_*.sqlite, img_item/, reg_code.txt)
# is mounted at /db, like the server mounts shinytigeR-DB at /opt/shinyapp.
services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    ports:
      - "7331:7331"
    volumes:
      - ..:/srv
      - ../../db:/db
    working_dir: /srv
    command: ["sh", "-c", "rv sync && rv run docker/run_dev.R"]
