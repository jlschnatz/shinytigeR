[project]
name = "shinytiger"
r_version = "4.6"

repositories = [
    { alias = "PPM", url = "https://packagemanager.posit.co/cran/latest" },
    { alias = "CRAN", url = "https://cran.r-project.org", force_source = true },
]

dependencies = [
    "shiny",
    "bslib",
    "bsicons",
    "shinyjs",
    "DBI",
    "RSQLite",
    "shinyauthr",
    "sodium",
    "ggplot2",
    "markdown",
    "rclipboard",
    "testthat",
    "withr",
    "pkgload",
    "plotly",
    "highr",
    "katex",
    # AI feedback (R/ai_feedback.R). ellmer >= 0.5.0 and httr2 >= 1.2.3 need
    # rlang >= 1.3.0, which would replace ~30 locked packages; these two
    # versions accept rlang >= 1.1.0. Both are pure R (built from source).
    { name = "ellmer", url = "https://cran.r-project.org/src/contrib/Archive/ellmer/ellmer_0.4.1.tar.gz" },
    { name = "httr2", url = "https://cran.r-project.org/src/contrib/Archive/httr2/httr2_1.2.2.tar.gz" },
    "coro",
    "promises",
    "later",
]
